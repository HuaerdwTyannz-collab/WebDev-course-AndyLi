<head>
  <title>Pet Website Navigation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f7f1e8;
    }

    nav {
      background-color: #333333;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd166;
    }

    section {
      padding: 30px;
    }

    h1 {
      color: #4f772d;
    }
  </style>
</head>

<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#dogs">Dogs</a>
    <a href="#cats">Cats</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home">
    <h1>Andy’s Pet Care Website</h1>
    <p>This website shares simple information about pet care.</p>
  </section>

  <section id="dogs">
    <h2>Dog Care</h2>
    <p>Dogs need walks, food, water, and attention.</p>
  </section>

  <section id="cats">
    <h2>Cat Care</h2>
    <p>Cats need clean litter, food, water, and quiet resting spaces.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: petcare@example.com</p>
  </section>
</body>
