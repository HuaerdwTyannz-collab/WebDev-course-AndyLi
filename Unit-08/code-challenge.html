<head>
  <title>Responsive Pet Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8ed;
      margin: 0;
    }

    header {
      background-color: #6b8e23;
      color: white;
      text-align: center;
      padding: 20px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background-color: #333333;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .pet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .card {
      background-color: white;
      border: 2px solid #dddddd;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        text-align: center;
      }

      .pet-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Responsive Pet Care</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Dogs</a>
    <a href="#">Cats</a>
    <a href="#">Contact</a>
  </nav>

  <div class="pet-grid">
    <div class="card">
      <h2>Dogs</h2>
      <p>Dogs need exercise and care.</p>
    </div>

    <div class="card">
      <h2>Cats</h2>
      <p>Cats need clean spaces and food.</p>
    </div>

    <div class="card">
      <h2>Rabbits</h2>
      <p>Rabbits need fresh vegetables and space.</p>
    </div>
  </div>
</body>
